<svg viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A steaming mug next to a knocked-over cup of coffee on a café counter">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b1a12"/>
      <stop offset="100%" stop-color="#4a2e1f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.75">
      <stop offset="0%" stop-color="#ffcf7a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffcf7a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="counter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a6440"/>
      <stop offset="100%" stop-color="#6e4329"/>
    </linearGradient>
    <g id="bean">
      <ellipse cx="0" cy="0" rx="6" ry="4" fill="#3d2215"/>
      <path d="M -5 0.5 Q 0 -2 5 0.5" stroke="#1f110a" stroke-width="1.2" fill="none"/>
    </g>
  </defs>

  <!-- Wall and lamp light -->
  <rect width="900" height="200" fill="url(#wall)"/>
  <ellipse cx="300" cy="20" rx="230" ry="150" fill="url(#glow)"/>
  <ellipse cx="640" cy="20" rx="200" ry="130" fill="url(#glow)"/>

  <!-- Pendant lamps -->
  <g fill="#1a0f0a">
    <rect x="299" y="0" width="2" height="26"/>
    <path d="M 282 40 L 288 26 L 312 26 L 318 40 Z"/>
    <rect x="639" y="0" width="2" height="18"/>
    <path d="M 624 31 L 629 18 L 651 18 L 656 31 Z"/>
  </g>
  <ellipse cx="300" cy="41" rx="10" ry="3" fill="#ffe2a8"/>
  <ellipse cx="640" cy="32" rx="9" ry="3" fill="#ffe2a8"/>

  <!-- Shelf with jars -->
  <rect x="40" y="86" width="190" height="6" rx="2" fill="#6e4329"/>
  <rect x="56" y="56" width="26" height="30" rx="4" fill="#c9b79c" opacity="0.85"/>
  <rect x="56" y="66" width="26" height="20" rx="3" fill="#5b3523"/>
  <rect x="54" y="52" width="30" height="6" rx="2" fill="#8a5a3b"/>
  <rect x="96" y="62" width="22" height="24" rx="4" fill="#c9b79c" opacity="0.85"/>
  <rect x="96" y="70" width="22" height="16" rx="3" fill="#7a4a2e"/>
  <rect x="94" y="58" width="26" height="6" rx="2" fill="#8a5a3b"/>
  <!-- Plant -->
  <path d="M 150 86 L 154 70 L 176 70 L 180 86 Z" fill="#b5653f"/>
  <path d="M 165 70 Q 150 50 140 56 M 165 70 Q 168 46 160 40 M 165 70 Q 182 52 192 58" stroke="#6c9a5b" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Window with a night sky -->
  <rect x="740" y="34" width="120" height="84" rx="4" fill="#1a0f0a"/>
  <rect x="746" y="40" width="108" height="72" rx="2" fill="#1f3350"/>
  <circle cx="826" cy="60" r="9" fill="#f3e7c4"/>
  <circle cx="822" cy="57" r="9" fill="#1f3350"/>
  <g fill="#f3e7c4">
    <circle cx="764" cy="54" r="1.2"/>
    <circle cx="790" cy="72" r="1"/>
    <circle cx="806" cy="48" r="1.1"/>
    <circle cx="772" cy="92" r="1"/>
    <circle cx="840" cy="94" r="1.2"/>
  </g>
  <rect x="798" y="40" width="4" height="72" fill="#1a0f0a"/>
  <rect x="746" y="74" width="108" height="4" fill="#1a0f0a"/>

  <!-- Counter -->
  <rect x="0" y="150" width="900" height="50" fill="url(#counter)"/>
  <rect x="0" y="146" width="900" height="6" fill="#b37a52"/>
  <g stroke="#5e3822" stroke-width="1.5" opacity="0.5">
    <line x1="0" y1="170" x2="900" y2="170"/>
    <line x1="0" y1="188" x2="900" y2="188"/>
  </g>

  <!-- Moka pot -->
  <g transform="translate(490,0)">
    <path d="M -22 148 L -16 118 L 16 118 L 22 148 Z" fill="#9ea3a8"/>
    <rect x="-18" y="112" width="36" height="7" fill="#7d8287"/>
    <path d="M -16 112 L -11 86 L 11 86 L 16 112 Z" fill="#b4b9be"/>
    <path d="M -12 86 Q 0 76 12 86 Z" fill="#7d8287"/>
    <circle cx="0" cy="78" r="3" fill="#1a0f0a"/>
    <path d="M 11 90 L 24 84 L 22 92 L 14 98 Z" fill="#9ea3a8"/>
    <path d="M -15 92 Q -32 96 -26 112 L -20 110 Q -24 100 -15 100 Z" fill="#1a0f0a"/>
  </g>

  <!-- Steaming mug -->
  <g transform="translate(330,0)">
    <path d="M 34 100 Q 62 100 62 120 Q 62 140 34 138" stroke="#e9dccb" stroke-width="9" fill="none"/>
    <rect x="-38" y="88" width="76" height="60" rx="10" fill="#e9dccb"/>
    <ellipse cx="0" cy="90" rx="38" ry="7" fill="#d6c6b0"/>
    <ellipse cx="0" cy="91" rx="32" ry="5" fill="#5b3523"/>
    <ellipse cx="-4" cy="90.5" rx="12" ry="2" fill="#8a5a3b"/>
    <!-- Mug logo: a tiny lightning bolt -->
    <path d="M 4 104 L -8 122 L 0 122 L -4 138 L 10 116 L 2 116 Z" fill="#c8553d"/>

    <g stroke="#f3e7d6" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M -14 80 Q -22 66 -14 54 Q -6 42 -14 30">
        <animate attributeName="opacity" values="0;0.7;0" dur="4s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 6; 0 -6" dur="4s" repeatCount="indefinite"/>
      </path>
      <path d="M 2 78 Q -6 62 2 50 Q 10 38 2 24">
        <animate attributeName="opacity" values="0;0.7;0" dur="4s" begin="1.3s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 6; 0 -6" dur="4s" begin="1.3s" repeatCount="indefinite"/>
      </path>
      <path d="M 18 80 Q 10 66 18 54 Q 26 42 18 30">
        <animate attributeName="opacity" values="0;0.7;0" dur="4s" begin="2.6s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 6; 0 -6" dur="4s" begin="2.6s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- The chaos: a knocked-over cup and its spill -->
  <g transform="translate(600,0)">
    <path d="M -60 152 Q -66 146 -40 145 Q -10 142 30 146 Q 70 144 92 150 Q 98 156 70 158 Q 30 160 -10 157 Q -50 158 -60 152 Z" fill="#4a2716"/>
    <ellipse cx="20" cy="150" rx="30" ry="2.5" fill="#6b3b22"/>
    <!-- Drip over the counter edge -->
    <path d="M 84 152 Q 88 152 88 160 L 88 168 Q 88 174 84 174 Q 80 174 80 168 L 80 160 Q 80 152 84 152 Z" fill="#4a2716"/>
    <!-- On its side, mouth towards the spill, handle up -->
    <path d="M -40 124 Q -36 106 -22 108 Q -12 110 -12 120" stroke="#c8553d" stroke-width="6" fill="none"/>
    <path d="M -52 126 L 0 116 L 0 148 L -52 148 Z" fill="#c8553d"/>
    <ellipse cx="0" cy="132" rx="5" ry="16" fill="#a8442f"/>
    <ellipse cx="0.5" cy="132" rx="3" ry="13" fill="#4a2716"/>
  </g>

  <!-- Scattered beans -->
  <use href="#bean" transform="translate(220,156) rotate(20)"/>
  <use href="#bean" transform="translate(240,162) rotate(-35)"/>
  <use href="#bean" transform="translate(560,160) rotate(60)"/>
  <use href="#bean" transform="translate(250,164) rotate(5)"/>
  <use href="#bean" transform="translate(720,162) rotate(-15)"/>
  <use href="#bean" transform="translate(708,170) rotate(40)"/>
  <use href="#bean" transform="translate(810,158) rotate(-60)"/>
</svg>
